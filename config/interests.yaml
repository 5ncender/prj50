# 관심 프로파일 — 뉴스·리서치 선별 점수의 기준.
# 대략적이어도 된다. 피드백이 쌓이면서 다듬는다.
# 보유 수량·평단 같은 포트폴리오 정보는 여기 말고 Google Sheets에 둔다 (Phase 5).

asset_classes: [kr_equity, us_equity, bonds, rates, commodities]

# 보유 또는 관심 종목
tickers:
  kr: []    # 예: ["005930", "000660"]
  us: []    # 예: ["NVDA", "TLT"]

# 관심 테마 (한국어·영어 섞어도 됨)
themes: []  # 예: ["AI 반도체", "US fiscal deficit", "원/달러 환율"]

# 보고 싶지 않은 주제
exclude: [] # 예: ["코인", "연예"]
